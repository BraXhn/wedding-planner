name: Testa och publicera

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"   # varje måndag: bygg om med senaste säkerhetsuppdateringarna i bas-imagen
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installera beroenden
        run: pip install -r requirements.txt
      - name: Kör testsviten
        run: bash tests/run.sh

  image:
    name: Docker-image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image-namn och version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "APP_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Logga in på GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Taggar
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Bygg (amd64 + arm64) och publicera
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Röktest av imagen
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name wp -p 8080:8080 --read-only --tmpfs /tmp \
            --cap-drop=ALL --cap-add=CHOWN --cap-add=SETUID --cap-add=SETGID \
            --security-opt no-new-privileges:true \
            -v "$RUNNER_TEMP/data:/data" "${IMAGE}:sha-${GITHUB_SHA::7}"
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/login | grep -q "Logga in"
          # appen (PID 1) ska köra som 99:100 utan några capabilities
          docker exec wp sh -c 'grep -qE "^Uid:\s+99\s" /proc/1/status && grep -qE "^CapEff:\s+0+$" /proc/1/status' \
            || { echo "Appen kör inte som 99 utan capabilities"; docker exec wp cat /proc/1/status; exit 1; }
          docker logs wp 2>&1 | grep -q "Engångslösenord"
          # tidszonen ska gälla i containern (annars blir "idag" fel mellan 00 och 02)
          docker exec wp python -c "import time; assert time.tzname[0] == 'CET', time.tzname" \
            || { echo "TZ=Europe/Stockholm slår inte igenom – saknas tzdata?"; exit 1; }
          docker logs wp
          docker rm -f wp
